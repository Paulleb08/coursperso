<title>Prof Perso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  /* Layout: one school-notebook column, Seyès-ruled paper with a red margin line; blocks are chapters. */
  :root {
    --paper:#fbfbf6; --card:#ffffff; --ink:#1f2433; --mute:#5d6475; --blue:#2b44a8; --margin:#d1464c; --rule:#dfe3f0; --ok:#1f7a4d;
    --display:"Bricolage Grotesque", system-ui, sans-serif; --body:"Source Serif 4", Georgia, serif; --ui:system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper:#14171d; --card:#1c2029; --ink:#e7e9f0; --mute:#9aa1b2; --blue:#8ea2ff; --margin:#ff7a7f; --rule:#2a3040; --ok:#5fd39a; color-scheme:dark } }
  :root[data-theme="dark"] {
    --paper:#14171d; --card:#1c2029; --ink:#e7e9f0; --mute:#9aa1b2; --blue:#8ea2ff; --margin:#ff7a7f; --rule:#2a3040; --ok:#5fd39a; color-scheme:dark }
  * { box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font:17px/1.6 var(--body);
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:24px 64px; }
  main { max-width:760px; margin:0 auto; display:grid; gap:20px; }
  h1, h2, h3, summary { font-family:var(--display); text-wrap:balance; line-height:1.2; }
  h1 { font-size:2.2rem; font-weight:800; margin:0; color:var(--blue); }
  h1 small { display:block; font:400 1rem var(--body); color:var(--mute); margin-top:4px; }
  .sheet { background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:20px 20px 20px 36px; position:relative; min-width:0; }
  .sheet::before { content:""; position:absolute; left:20px; top:0; bottom:0; width:2px; background:var(--margin); opacity:.55; }
  .sheet h2 { margin:0 0 8px; font-size:1.3rem; }
  details.bloc > summary { font-size:1.25rem; font-weight:600; cursor:pointer; color:var(--blue); }
  .cours { min-width:0; overflow-wrap:anywhere; }
  .cours pre, .cours table { overflow-x:auto; display:block; }
  .ex { border-top:1px dashed var(--rule); padding-top:14px; margin-top:16px; }
  .ex h3 { margin:0; font-size:1rem; font-family:var(--ui); text-transform:uppercase; letter-spacing:.06em; color:var(--margin); }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  button, label.btn { font:600 .95rem var(--ui); background:var(--blue); color:var(--card); border:0; border-radius:6px; padding:9px 14px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--blue); box-shadow:inset 0 0 0 1.5px var(--blue); }
  button:disabled, label.btn[aria-disabled="true"] { opacity:.5; cursor:wait; }
  button:focus-visible, label.btn:focus-within, textarea:focus-visible { outline:3px solid var(--margin); outline-offset:2px; }
  textarea { width:100%; min-height:110px; padding:10px; font:15px/1.5 var(--ui); color:var(--ink); background:var(--paper); border:1px solid var(--rule); border-radius:6px; }
  .mute { color:var(--mute); font:.9rem var(--ui); }
  .corr { background:var(--paper); border-left:3px solid var(--ok); padding:10px 14px; margin-top:12px; border-radius:0 6px 6px 0; }
  .tag { font:600 .75rem var(--ui); letter-spacing:.06em; text-transform:uppercase; color:var(--margin); }
  #status { position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; font:600 .95rem var(--ui); background:var(--blue); color:var(--card); padding:8px 14px; border-radius:6px; }
  #status.err { background:var(--margin); }
  @media (prefers-reduced-motion: no-preference) { details.bloc[open] .cours { animation:fade .25s ease-out; } }
  @keyframes fade { from { opacity:.4 } to { opacity:1 } }
</style>

<main>
  <header>
    <h1>Prof Perso<small>Ton cours en blocs, des exercices inédits et ta copie corrigée sur photo.</small></h1>
  </header>
  <div id="status" role="status" hidden></div>

  <section class="sheet">
    <h2>Ton cours</h2>
    <p class="mute">PDF, photos ou fichiers texte, et/ou le texte copié depuis NotebookLM (guide d'étude, notes, résumé). Utilise ton compte Claude : pas de clé API.</p>
    <div class="row">
      <label class="btn" for="files">Choisir des fichiers<input id="files" type="file" multiple accept=".pdf,image/*,.txt,.md" hidden></label>
      <span id="fileNames" class="mute"></span>
    </div>
    <p><label for="paste" class="mute">Texte à coller</label>
    <textarea id="paste" placeholder="Colle ici le texte de NotebookLM ou de ton cours…"></textarea></p>
    <div class="row"><button id="go">Restructurer en blocs</button></div>
  </section>

  <div id="course"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const EXAMPLE = { exemple: true, titre: "Exemple : les dérivées", blocs: [{
  titre: "Dérivée d'une puissance",
  cours: "La **dérivée** mesure la vitesse de variation d'une fonction.\n\n**Règle :** si f(x) = xⁿ alors f′(x) = n·xⁿ⁻¹.\n\n*Exemple résolu :* f(x) = x⁴ → f′(x) = 4x³.",
  exercices: [{ enonce: "Dérive g(x) = x⁵.", solution: "g′(x) = 5x⁴" }, { enonce: "Dérive h(x) = 3x² + x.", solution: "h′(x) = 6x + 1" }] }] };

let course = JSON.parse(store.get("course") || "null") || EXAMPLE;
const save = () => store.set("course", JSON.stringify(course));

const RULES = `Tu es un professeur particulier bienveillant et rigoureux. Tu écris en français, en Markdown.
Pour les maths, écris en notation lisible sans LaTeX (x², √x, ≤, →, fractions a/b).`;
const EX_SHAPE = `{"enonce": string, "solution": string}`;

let sample = null, imgMax = 0;
(async () => {
  sample = window.claude ? await claude.use("sample") : null;
  if (sample) imgMax = (await sample.limits().catch(() => null))?.images?.maxCount || 0;
  if (!sample) status("Ouvre cette page dans Claude (claude.ai) pour que le prof puisse répondre.", true);
})();

const ERRORS = { not_granted: "Tu n'as pas autorisé la page à utiliser Claude. Recharge la page pour qu'elle te le redemande.",
  rate_limited: "Limite d'utilisation de Claude atteinte. Réessaie un peu plus tard.", refused: "Claude a refusé cette demande.",
  invalid_json: "Réponse illisible. Réessaie.", prompt_too_large: "Cours trop long : envoie-le en plusieurs morceaux.",
  image_rejected: "Image refusée : essaie une autre photo (JPEG ou PNG).", images_unavailable: "Envoi de photos impossible dans cette vue.",
  sampling_disabled: "Claude n'est pas disponible pour ce compte.", session_expired: "Reconnecte-toi à Claude." };

function status(msg, err) { const s = $("status"); s.hidden = !msg; s.textContent = msg || ""; s.className = err ? "err" : ""; }

async function ask(prompt, { json, images, fresh } = {}) {
  if (!sample) throw { code: "unavailable", message: "Ouvre cette page dans Claude (claude.ai)." };
  const opts = { cache: fresh ? false : undefined, ...(images?.length && { images }) };
  return json ? sample.json(RULES + "\n\n" + prompt, opts) : (await sample(RULES + "\n\n" + prompt, opts)).text;
}

async function pdfToParts(file) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let text = "";
  for (let i = 1; i <= pdf.numPages; i++) text += (await (await pdf.getPage(i)).getTextContent()).items.map(t => t.str).join(" ") + "\n";
  if (text.trim().length > 50) return { text: `PDF ${file.name} :\n${text}`, images: [] };
  const images = []; // scanned PDF: send pages as images
  for (let i = 1; i <= Math.min(pdf.numPages, imgMax); i++) {
    const page = await pdf.getPage(i), vp = page.getViewport({ scale: 1.5 });
    const c = Object.assign(document.createElement("canvas"), { width: vp.width, height: vp.height });
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    images.push(await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)));
  }
  return { text: `PDF scanné ${file.name} (pages en images).`, images };
}

async function readFiles(files) {
  let text = "", images = [];
  for (const f of files) {
    if (f.type === "application/pdf") { const p = await pdfToParts(f); text += p.text + "\n"; images.push(...p.images); }
    else if (f.type.startsWith("image/")) images.push(f);
    else text += `Fichier ${f.name} :\n${await f.text()}\n`;
  }
  if (images.length > imgMax) throw { code: "x", message: `Trop d'images : ${imgMax} maximum par envoi.` };
  return { text, images };
}

async function busy(btn, label, fn) {
  btn.disabled = true; btn.setAttribute("aria-disabled", "true"); status(label);
  try { await fn(); status(""); }
  catch (e) { status(ERRORS[e?.code] || e?.message || "Erreur inattendue. Réessaie.", true); }
  finally { btn.disabled = false; btn.removeAttribute("aria-disabled"); }
}

$("files").onchange = () => $("fileNames").textContent = [...$("files").files].map(f => f.name).join(", ");

$("go").onclick = (e) => busy(e.target, "Le prof lit ton cours et le restructure… (jusqu'à 1–2 min)", async () => {
  const { text, images } = await readFiles([...$("files").files]);
  const pasted = $("paste").value.trim();
  if (!text.trim() && !images.length && !pasted) throw { message: "Ajoute un fichier ou colle du texte." };
  const r = await ask(`Voici le cours d'un élève${images.length ? " (une partie est dans les images jointes)" : ""}.
${text}${pasted ? `\nContenu collé (ex. NotebookLM) :\n${pasted}` : ""}

Restructure ce cours en blocs progressifs (une notion par bloc). Pour chaque bloc : un cours clair et complet
(définitions, méthode, exemple résolu), puis 3 exercices NOUVEAUX, différents de ceux présents dans le cours
(l'élève les a peut-être déjà faits), de difficulté croissante, avec une solution détaillée.
Réponds uniquement en JSON : {"titre": string, "blocs": [{"titre": string, "cours": string, "exercices": [${EX_SHAPE}]}]}`,
    { json: true, images, fresh: true });
  if (!Array.isArray(r?.blocs)) throw { code: "invalid_json" };
  course = r; save(); render();
});

const md = (s) => DOMPurify.sanitize(marked.parse(String(s || "")));
const txt = (s) => DOMPurify.sanitize(String(s || ""), { ALLOWED_TAGS: [] });
function button(label, cls, onclick) { const b = document.createElement("button"); b.textContent = label; b.className = cls; b.onclick = () => onclick(b); return b; }

function render() {
  const root = $("course"); root.innerHTML = "";
  const head = document.createElement("div");
  head.innerHTML = `${course.exemple ? '<span class="tag">Exemple — remplacé par ton cours</span>' : ""}<h2>${txt(course.titre)}</h2>`;
  root.append(head);
  course.blocs.forEach((bloc, bi) => {
    const d = document.createElement("details"); d.className = "bloc sheet"; d.open = bi === 0;
    d.innerHTML = `<summary>${bi + 1}. ${txt(bloc.titre)}</summary><div class="cours">${md(bloc.cours)}</div>`;
    const row = document.createElement("div"); row.className = "row";
    row.append(
      button("Je ne comprends pas : réexplique", "ghost", (b) => busy(b, "Le prof réécrit le cours plus simplement…", async () => {
        bloc.cours = await ask(`Réécris ce cours pour qu'il soit plus facile à comprendre : phrases simples, analogies,
étapes pas à pas, un exemple supplémentaire commenté. Ne perds aucune notion. Réponds avec le cours seul.\n\n${bloc.cours}`, { fresh: true });
        save(); render(); })),
      button("Nouveaux exercices", "ghost", (b) => busy(b, "Le prof prépare de nouveaux exercices…", async () => {
        const r = await ask(`Cours :\n${bloc.cours}\n\nExercices déjà donnés (ne pas les répéter) :\n${bloc.exercices.map(x => x.enonce).join("\n---\n")}
\nGénère 3 nouveaux exercices différents, difficulté croissante, avec solutions détaillées.
Réponds uniquement en JSON : {"exercices": [${EX_SHAPE}]}`, { json: true, fresh: true });
        if (!Array.isArray(r?.exercices)) throw { code: "invalid_json" };
        bloc.exercices.push(...r.exercices); save(); render(); })));
    d.append(row);
    bloc.exercices.forEach((ex, ei) => d.append(exercise(ex, ei)));
    root.append(d);
  });
}

function exercise(ex, ei) {
  const d = document.createElement("div"); d.className = "ex";
  d.innerHTML = `<h3>Exercice ${ei + 1}</h3><div class="cours">${md(ex.enonce)}</div>`;
  const id = "photo-" + Math.random().toString(36).slice(2);
  const lbl = document.createElement("label"); lbl.className = "btn"; lbl.htmlFor = id;
  const input = Object.assign(document.createElement("input"), { id, type: "file", accept: "image/*", hidden: true });
  lbl.append("Corriger ma copie (photo)", input);
  input.onchange = () => input.files[0] && busy(lbl, "Le prof corrige ta copie…", async () => {
    ex.correction = await ask(`L'image jointe est la photo de la réponse d'un élève à cet exercice.

Énoncé :\n${ex.enonce}\n\nSolution de référence :\n${ex.solution}

Corrige la copie comme un prof : retranscris ce que l'élève a écrit, indique ce qui est juste, chaque erreur
précise et pourquoi, donne une note sur 10, puis un conseil pour progresser. Si la photo est illisible, dis-le.`,
      { images: [input.files[0]], fresh: true });
    save(); render(); });
  const sol = document.createElement("details"); sol.innerHTML = `<summary class="mute">Voir la solution</summary><div class="cours">${md(ex.solution)}</div>`;
  const row = document.createElement("div"); row.className = "row"; row.append(lbl);
  d.append(row, sol);
  if (ex.correction) { const c = document.createElement("div"); c.className = "corr"; c.innerHTML = `<b>Correction</b>${md(ex.correction)}`; d.append(c); }
  return d;
}

render();
</script>
