<title>Prof Perso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  /* Layout: school notebook. Desktop = course list sidebar + page; phone = one view at a time with a bottom tab bar. */
  :root {
    --paper:#fbfbf6; --card:#ffffff; --ink:#1f2433; --mute:#5d6475; --blue:#2b44a8; --margin:#d1464c; --rule:#dfe3f0; --ok:#1f7a4d;
    --display:"Bricolage Grotesque", system-ui, sans-serif; --body:"Source Serif 4", Georgia, serif; --ui:system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper:#14171d; --card:#1c2029; --ink:#e7e9f0; --mute:#9aa1b2; --blue:#8ea2ff; --margin:#ff7a7f; --rule:#2a3040; --ok:#5fd39a; color-scheme:dark } }
  :root[data-theme="dark"] {
    --paper:#14171d; --card:#1c2029; --ink:#e7e9f0; --mute:#9aa1b2; --blue:#8ea2ff; --margin:#ff7a7f; --rule:#2a3040; --ok:#5fd39a; color-scheme:dark }
  * { box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font:18px/1.6 var(--body);
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:16px 96px; }
  h1, h2, h3, summary { font-family:var(--display); text-wrap:balance; line-height:1.2; }
  h2 { font-size:1.35rem; margin:0 0 10px; }

  .top { max-width:1180px; margin:0 auto 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
  .top h1 { margin:0; font-size:1.8rem; font-weight:800; color:var(--blue); margin-right:auto; }
  .subject { display:flex; flex-wrap:wrap; align-items:center; gap:8px; font:600 1rem var(--ui); }
  select, input[type=text], input[type=search], textarea { font:16px/1.4 var(--ui); color:var(--ink); background:var(--card); border:1.5px solid var(--rule); border-radius:8px; padding:10px 12px; min-height:46px; }
  textarea { width:100%; min-height:110px; }

  .app { max-width:1180px; margin:0 auto; display:grid; grid-template-columns:280px minmax(0,1fr); gap:20px; align-items:start; }
  aside { position:sticky; top:16px; display:grid; gap:8px; }
  aside h2 { font-size:1rem; font-family:var(--ui); text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:6px 0 0; }
  .navbtn { text-align:left; width:100%; justify-content:flex-start; background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--rule); font-weight:500; }
  .navbtn[aria-current="true"] { background:var(--blue); color:var(--card); box-shadow:none; font-weight:700; }
  main { display:grid; gap:18px; min-width:0; }

  .sheet { background:var(--card); border:1px solid var(--rule); border-radius:8px; padding:20px 20px 20px 36px; position:relative; min-width:0; }
  .sheet::before { content:""; position:absolute; left:20px; top:0; bottom:0; width:2px; background:var(--margin); opacity:.55; }
  details.bloc > summary { font-size:1.2rem; font-weight:600; cursor:pointer; color:var(--blue); }
  .cours { min-width:0; overflow-wrap:anywhere; }
  .cours pre, .cours table { overflow-x:auto; display:block; }
  .ex { border-top:1px dashed var(--rule); padding-top:14px; margin-top:16px; }
  .ex h3 { margin:0; font:700 .9rem var(--ui); text-transform:uppercase; letter-spacing:.06em; color:var(--margin); }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
  button, label.btn { font:600 1rem var(--ui); background:var(--blue); color:var(--card); border:0; border-radius:8px; padding:11px 16px; min-height:46px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  button.ghost { background:transparent; color:var(--blue); box-shadow:inset 0 0 0 1.5px var(--blue); }
  button.danger { background:transparent; color:var(--margin); box-shadow:inset 0 0 0 1.5px var(--margin); }
  button.big { font-size:1.15rem; padding:14px 22px; }
  button:disabled { opacity:.5; cursor:wait; }
  :is(button, select, input, textarea, summary):focus-visible, label.btn:focus-within { outline:3px solid var(--margin); outline-offset:2px; }
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; width:100%; min-height:140px; border:3px dashed var(--blue); border-radius:12px; background:var(--paper); color:var(--blue); font:700 1.25rem var(--ui); cursor:pointer; padding:16px; }
  .drop span { font:400 1rem var(--ui); color:var(--mute); }
  .drop.over { background:var(--rule); }
  .mute { color:var(--mute); font:.95rem var(--ui); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; list-style:none; padding:0; margin:10px 0 0; }
  .chips li { font:.9rem var(--ui); background:var(--paper); border:1px solid var(--rule); border-radius:999px; padding:4px 8px 4px 12px; display:flex; align-items:center; gap:6px; }
  .chips button { min-height:28px; padding:2px 8px; background:transparent; color:var(--margin); }
  .pick { display:grid; gap:6px; margin:10px 0 0; padding:0; list-style:none; }
  .pick label { display:flex; gap:10px; align-items:center; font:1rem var(--ui); padding:8px 10px; border:1px solid var(--rule); border-radius:8px; cursor:pointer; }
  .pick input { width:22px; height:22px; flex:none; }
  .answer { background:var(--paper); border-radius:8px; padding:10px 14px; margin-top:10px; }
  .corr { background:var(--paper); border-left:3px solid var(--ok); padding:10px 14px; margin-top:12px; border-radius:0 8px 8px 0; }
  .card { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:12px; min-height:200px; padding:24px; border:2px solid var(--blue); border-radius:14px; background:var(--paper); font-size:1.2rem; }
  .card .verso { border-top:1px dashed var(--rule); padding-top:12px; width:100%; }
  .choices { display:grid; gap:8px; margin-top:12px; }
  .choices button { justify-content:flex-start; text-align:left; background:var(--card); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--rule); font-weight:500; }
  .choices button.right { box-shadow:inset 0 0 0 3px var(--ok); color:var(--ok); font-weight:700; }
  .choices button.wrong { box-shadow:inset 0 0 0 3px var(--margin); color:var(--margin); }
  .match { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .match .choices { margin-top:0; }
  .match button[data-n]:not([data-n=""])::before { content:attr(data-n); display:inline-grid; place-items:center; min-width:1.6em; height:1.6em; border-radius:999px; background:var(--blue); color:var(--card); font-weight:700; margin-right:6px; }
  .match button.selected { box-shadow:inset 0 0 0 3px var(--blue); }
  .score { font:800 2rem var(--display); color:var(--blue); text-align:center; margin:0; }
  .pending { color:var(--mute); font-style:italic; }
  .empty { text-align:center; padding:28px 16px; }
  #status { position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; font:600 1.05rem var(--ui); background:var(--blue); color:var(--card); padding:12px 16px; border-radius:8px; max-width:1180px; margin:0 auto 12px; }
  #status.err { background:var(--margin); }
  .back { display:none; }
  .tabs { display:none; }

  @media (max-width: 760px) {
    body { font-size:17px; padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px)); }
    .top h1 { font-size:1.5rem; }
    .app { grid-template-columns:minmax(0,1fr); }
    aside { position:static; }
    body:not([data-view="list"]) aside { display:none; }
    body[data-view="list"] main { display:none; }
    .back { display:inline-flex; }
    .sheet { padding:16px 14px 16px 28px; }
    .sheet::before { left:14px; }
    .tabs { display:grid; grid-template-columns:repeat(4, 1fr); position:fixed; left:0; right:0; bottom:0; z-index:10;
      background:var(--card); border-top:1px solid var(--rule);
      padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
    .tabs button { flex-direction:column; gap:2px; background:transparent; color:var(--mute); font-size:.85rem; min-height:56px; }
    .tabs button span { font-size:1.4rem; line-height:1; }
    .tabs button[aria-current="true"] { color:var(--blue); }
  }
</style>

<header class="top">
  <h1>Prof Perso</h1>
  <div class="subject">
    <label for="matiere">Matière</label>
    <select id="matiere"></select>
    <button class="ghost" id="newSubject">＋ Nouvelle matière</button>
  </div>
</header>
<div id="status" role="status" hidden></div>
<div class="app">
  <aside id="aside"></aside>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Navigation">
  <button data-tab="list"><span>📚</span>Cours</button>
  <button data-tab="add"><span>➕</span>Ajouter</button>
  <button data-tab="train"><span>🎯</span>S'entraîner</button>
  <button data-tab="fiches"><span>📝</span>Fiches</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } } };
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const uid = () => Math.random().toString(36).slice(2, 10);
const DRIVE = "Google Drive";
const MAX_IMAGES = 20; // read in batches of the platform's per-call limit, then transcribed to text

// ---------- data ----------
// {matieres: [{id, nom, cours: [course], fiches: [{id, titre, contenu}]}], m, c}
function load() {
  const d = JSON.parse(store.get("prof") || "null");
  if (d?.matieres?.length) return d;
  const old = JSON.parse(store.get("courses") || "null") || [JSON.parse(store.get("course") || "null")].filter(x => x && !x.exemple);
  return { matieres: [{ id: uid(), nom: "Mes cours", cours: old.map(c => ({ id: uid(), ...c })), fiches: [] }], m: 0, c: old.length ? 0 : -1 };
}
const data = load();
const mat = () => data.matieres[data.m];
const course = () => mat().cours[data.c];
function save() { if (!store.set("prof", JSON.stringify(data))) status("Mémoire du navigateur pleine : supprime un ancien cours pour continuer à enregistrer.", true); }

let view = course() ? "course" : "add";
const narrow = () => matchMedia("(max-width: 760px)").matches;

// ---------- Claude ----------
const RULES = `Tu es un professeur particulier bienveillant et rigoureux. Tu écris en français, en Markdown.
Pour les maths, écris en notation lisible sans LaTeX (x², √x, ≤, →, fractions a/b).`;
const EX_SHAPE = `{"enonce": string, "solution": string}`;
let sample = null, mcp = null, imgMax = 0;
(async () => {
  await null; // let the rest of the script load before the first render, even outside claude.ai
  [sample, mcp] = window.claude ? await Promise.all([claude.use("sample"), claude.use("mcp")]) : [null, null];
  if (sample) imgMax = (await sample.limits().catch(() => null))?.images?.maxCount || 0;
  else imgMax = MAX_IMAGES; // local mode reads photos with OCR, one by one
  render();
})();

const ERRORS = { not_granted: "Tu n'as pas autorisé la page à utiliser Claude. Recharge la page pour qu'elle te le redemande.",
  rate_limited: "Limite d'utilisation de Claude atteinte. Réessaie un peu plus tard.", refused: "Claude a refusé cette demande.",
  invalid_json: "Réponse illisible. Réessaie.", prompt_too_large: "Trop de texte d'un coup : choisis moins de cours ou de documents.",
  image_rejected: "Image refusée : essaie une autre photo (JPEG ou PNG).", images_unavailable: "Envoi de photos impossible dans cette vue.",
  sampling_disabled: "Claude n'est pas disponible pour ce compte.", session_expired: "Reconnecte-toi à Claude.",
  server_not_connected: "Google Drive n'est pas connecté : dans claude.ai, va dans Paramètres → Connecteurs et ajoute Google Drive.",
  needs_reauth: "Reconnecte Google Drive dans claude.ai → Paramètres → Connecteurs.",
  not_in_manifest: "Tu as refusé l'accès à Google Drive pour cette page.", approval_required: "Autorise l'accès à Google Drive pour continuer.",
  server_unavailable: "Google Drive ne répond pas. Réessaie dans un instant." };

function status(msg, err) { const s = $("status"); s.hidden = !msg; s.textContent = msg || ""; s.className = err ? "err" : ""; }

// ---------- free local AI (used when the page runs as a standalone website) ----------
const MODELS = {
  leger: { id: "Qwen2.5-1.5B-Instruct-q4f16_1-MLC", nom: "Léger (téléphone, ~1 Go)" },
  standard: { id: "Qwen2.5-3B-Instruct-q4f16_1-MLC", nom: "Standard (ordinateur, ~2 Go)" },
  puissant: { id: "Qwen2.5-7B-Instruct-q4f16_1-MLC", nom: "Puissant (Mac récent, ~5 Go)" } };
const LOCAL_LIMIT = 14000; // characters of prompt the small model's context can take
let enginePromise = null, ocrWorker = null;
const modelKey = () => store.get("model") || (narrow() ? "leger" : "standard");
function localEngine() {
  if (window.__PROF_LOCAL_ENGINE) return Promise.resolve(window.__PROF_LOCAL_ENGINE); // tests
  if (!navigator.gpu) return Promise.reject({ message: "Ce navigateur ne peut pas faire tourner l'IA gratuite. Utilise Chrome ou Edge récent, ou Safari 26 (Mac, iPhone)." });
  return enginePromise ||= Promise.all([import("https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.86/+esm"), navigator.gpu.requestAdapter()]).then(([webllm, gpu]) =>
    // GPUs without 16-bit float shaders need the f32 build of the same model.
    webllm.CreateMLCEngine(gpu?.features.has("shader-f16") ? MODELS[modelKey()].id : MODELS[modelKey()].id.replace("q4f16_1", "q4f32_1"), {
      initProgressCallback: (r) => status(`⏳ Préparation de l'IA gratuite (une seule fois) : ${Math.round((r.progress || 0) * 100)} %`) },
      { context_window_size: 8192 })).catch(e => { enginePromise = null; throw { message: "Impossible de charger l'IA gratuite : " + (e?.message || e) }; });
}
async function ocr(blob) {
  if (window.__PROF_OCR) return window.__PROF_OCR(blob); // tests
  if (!ocrWorker) { const T = await import("https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/+esm"); ocrWorker = await (T.default || T).createWorker("fra"); }
  return (await ocrWorker.recognize(blob)).data.text;
}
const parseJSON = (t) => { try { return JSON.parse(t); } catch { const m = String(t).match(/[\[{][\s\S]*[\]}]/); if (m) try { return JSON.parse(m[0]); } catch {} } throw { code: "invalid_json" }; };
async function askLocal(prompt, { json, images }) {
  const engine = await localEngine();
  for (const [i, img] of (images || []).entries()) prompt = `Texte lu sur l'image ${i + 1} (lecture automatique, peut contenir des fautes) :\n${await ocr(img)}\n\n` + prompt;
  if (prompt.length > LOCAL_LIMIT) prompt = prompt.slice(0, LOCAL_LIMIT - 2500) + "\n[… cours raccourci pour l'IA gratuite …]\n" + prompt.slice(-2500);
  if (json) prompt += "\nRéponds uniquement avec le JSON demandé, sans aucun texte avant ou après.";
  const r = await engine.chat.completions.create({ messages: [{ role: "system", content: RULES }, { role: "user", content: prompt }],
    temperature: 0.4, max_tokens: 2500 }); // JSON is read from the reply text: WebLLM's forced JSON mode fails on some models
  const text = r.choices?.[0]?.message?.content || "";
  if (!text.trim()) throw { message: "L'IA gratuite n'a rien répondu. Réessaie." };
  return json ? parseJSON(text) : text;
}

async function ask(prompt, { json, images } = {}) {
  if (!sample) return askLocal(prompt, { json, images });
  const opts = { cache: false, ...(images?.length && { images }) };
  return json ? sample.json(RULES + "\n\n" + prompt, opts) : (await sample(RULES + "\n\n" + prompt, opts)).text;
}

async function busy(btn, label, fn) {
  if (btn) btn.disabled = true; status(label);
  try { await fn(); status(""); }
  catch (e) { status(ERRORS[e?.code] || e?.message || "Erreur inattendue. Réessaie.", true); }
  finally { if (btn) btn.disabled = false; }
}

// ---------- small DOM helpers ----------
const md = (s) => DOMPurify.sanitize(marked.parse(String(s || "")));
const txt = (s) => DOMPurify.sanitize(String(s || ""), { ALLOWED_TAGS: [] });
function el(tag, attrs = {}, ...kids) { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) k.startsWith("on") ? e[k] = v : e.setAttribute(k, v); e.append(...kids); return e; }
function button(label, cls, onclick) { return el("button", { class: cls, onclick: function () { onclick(this); } }, label); }
function html(tag, cls, markup) { const e = el(tag, { class: cls }); e.innerHTML = markup; return e; }
// A destructive or spoiler action needs a second, deliberate tap.
function twoTap(label, confirmLabel, cls, action) {
  return button(label, cls, (b) => { if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = confirmLabel; return; } action(b); });
}

// ---------- navigation ----------
let play = null; // flashcard deck or quiz being played: {kind, id}
function go(v, c) { if (c !== undefined) data.c = c; view = v; play = null; save(); render(); scrollTo({ top: 0 }); }
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));
$("matiere").onchange = () => { data.m = Number($("matiere").value); data.c = mat().cours.length ? 0 : -1; go(narrow() ? "list" : (course() ? "course" : "add")); };
$("newSubject").onclick = () => {
  const main = $("main"); main.innerHTML = ""; view = "newSubject";
  const input = el("input", { type: "text", id: "subjectName", placeholder: "Ex. : Mathématiques" });
  const create = () => { const nom = input.value.trim(); if (!nom) return;
    data.matieres.push({ id: uid(), nom, cours: [], fiches: [] }); data.m = data.matieres.length - 1; data.c = -1; go("add"); };
  input.onkeydown = (e) => e.key === "Enter" && create();
  main.append(el("section", { class: "sheet" }, el("h2", {}, "Nouvelle matière"),
    el("p", {}, el("label", { for: "subjectName", class: "mute" }, "Nom de la matière"), el("br"), input),
    el("div", { class: "row" }, button("Créer la matière", "big", create), button("Annuler", "ghost", () => go(course() ? "course" : "add")))));
  document.body.dataset.view = "newSubject"; input.focus();
};

function render() {
  document.body.dataset.view = view;
  const sel = $("matiere"); sel.innerHTML = "";
  data.matieres.forEach((m, i) => sel.append(el("option", { value: i }, `${m.nom} (${m.cours.length})`)));
  sel.value = data.m;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", String(b.dataset.tab === view || (view === "course" && b.dataset.tab === "list"))));
  renderAside();
  const main = $("main"); main.innerHTML = "";
  if (view === "add") main.append(...addView());
  else if (view === "fiches") main.append(...fichesView());
  else if (view === "train") main.append(...trainView());
  else if (course()) main.append(...courseView(course()));
  else main.append(...addView());
}

function renderAside() {
  const a = $("aside"); a.innerHTML = "";
  a.append(el("h2", {}, `Cours de ${mat().nom}`));
  if (!mat().cours.length) a.append(el("p", { class: "mute" }, "Aucun cours pour l'instant."));
  mat().cours.forEach((c, i) => a.append(el("button", { class: "navbtn", "aria-current": String(view === "course" && i === data.c), onclick: () => go("course", i) }, `📘 ${c.titre}`)));
  a.append(el("h2", {}, "Outils"),
    el("button", { class: "navbtn", "aria-current": String(view === "add"), onclick: () => go("add") }, "➕ Ajouter un cours"),
    el("button", { class: "navbtn", "aria-current": String(view === "train"), onclick: () => go("train") }, "🎯 Flashcards et quiz"),
    el("button", { class: "navbtn", "aria-current": String(view === "fiches"), onclick: () => go("fiches") }, "📝 Fiches de révision"));
  if (data.matieres.length > 1) a.append(twoTap(`🗑 Supprimer la matière « ${mat().nom} »`, "Toucher encore : supprime aussi ses cours et fiches", "danger", () => {
    data.matieres.splice(data.m, 1); data.m = 0; data.c = mat().cours.length ? 0 : -1; go(narrow() ? "list" : "add"); }));
}

// ---------- add a course ----------
const pending = { files: [], drive: [] }; // sources waiting to become a course

async function pdfToParts(file) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let text = "";
  for (let i = 1; i <= pdf.numPages; i++) text += (await (await pdf.getPage(i)).getTextContent()).items.map(t => t.str).join(" ") + "\n";
  if (text.trim().length > 50) return { text: `PDF ${file.name} :\n${text}`, images: [] };
  const images = []; // scanned PDF: send pages as images
  for (let i = 1; i <= Math.min(pdf.numPages, MAX_IMAGES); i++) {
    const page = await pdf.getPage(i), vp = page.getViewport({ scale: 1.5 });
    const c = Object.assign(document.createElement("canvas"), { width: vp.width, height: vp.height });
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    images.push(await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)));
  }
  return { text: `PDF scanné ${file.name} (pages en images).`, images };
}

async function readFiles(files) {
  let text = "", images = [];
  for (const f of files) {
    if (f.type === "application/pdf") { const p = await pdfToParts(f); text += p.text + "\n"; images.push(...p.images); }
    else if (f.type.startsWith("image/")) images.push(f);
    else text += `Fichier ${f.name} :\n${await f.text()}\n`;
  }
  if (images.length > MAX_IMAGES) throw { message: `Trop d'images : ${MAX_IMAGES} au maximum (photos et pages scannées).` };
  return { text, images };
}

function addView() {
  const list = el("ul", { class: "chips", "aria-label": "Sources ajoutées" });
  const refreshList = () => {
    list.innerHTML = "";

function driveBox(onAdd) {
  const box = el("details", { class: "drive" }, el("summary", { class: "mute" }, "🔗 Importer depuis Google Drive (tes sources NotebookLM)"));
  if (!mcp) { box.append(el("p", { class: "mute" }, "Disponible seulement dans la version claude.ai. Ici, ouvre ton document Google Drive, copie son texte et colle-le ci-dessous.")); return box; }
  const q = el("input", { type: "search", id: "driveQ", placeholder: "Nom du document…" });
  const results = el("ul", { class: "pick" });
  const search = (b) => busy(b, "⏳ Recherche dans ton Google Drive…", async () => {
    const term = q.value.trim().replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    const query = (term ? `(title contains '${term}' or fullText contains '${term}') and ` : "") + "trashed = false and not mimeType contains 'folder'";
    const res = await mcp.callTool(DRIVE, "search_files", { query, pageSize: 15, excludeContentSnippets: true });
    const files = res.payload?.files || [];
    results.innerHTML = "";
    if (!files.length) results.append(el("li", { class: "mute" }, "Aucun document trouvé."));
    for (const f of files) results.append(el("li", {}, el("label", {}, el("input", { type: "checkbox", value: f.id, "data-title": f.title }), txt(f.title))));
  });
  q.onkeydown = (e) => e.key === "Enter" && search(null);
  const importSel = (b) => busy(b, "⏳ Import des documents depuis Google Drive…", async () => {
    const picked = [...results.querySelectorAll("input:checked")];
    if (!picked.length) throw { message: "Coche au moins un document." };
    for (const c of picked) {
      const res = await mcp.callTool(DRIVE, "read_file_content", { fileId: c.value });
      pending.drive.push({ title: c.dataset.title, text: String(res.payload?.fileContent || "") });
      c.checked = false;
    }
    onAdd();
  });
  box.append(el("p", { class: "mute" }, "NotebookLM ne se connecte pas directement : importe ici les documents Google Drive que tu as mis dans ton carnet NotebookLM."),
    el("div", { class: "row" }, q, button("Chercher", "ghost", search)), results,
    el("div", { class: "row" }, button("Importer la sélection", "ghost", importSel)));
  return box;
}

async function prepare(b, pasted) {
  await busy(b, "⏳ Le prof lit tes sources…", async () => {
    const { text, images } = await readFiles(pending.files);
    const drive = pending.drive.map(d => `Document Google Drive « ${d.title} » :\n${d.text}`).join("\n\n");
    if (!text.trim() && !images.length && !pasted && !drive) throw { message: "Ajoute d'abord une photo, un PDF, un document ou du texte." };
    let scans = "";
    if (images.length && !imgMax) throw { code: "images_unavailable" };
    if (!sample) for (const [i, img] of images.entries()) {
      status(`⏳ Lecture de tes photos : ${i + 1} sur ${images.length}…`);
      scans += `\n[Page ${i + 1}]\n` + await ocr(img);
    }
    else for (let i = 0; i < images.length; i += imgMax) {
      const part = images.slice(i, i + imgMax);
      status(`⏳ Le prof lit tes photos ${i + 1} à ${i + part.length} sur ${images.length}…`);
      scans += `\n[Pages ${i + 1} à ${i + part.length}]\n` + await ask(`Les images jointes sont des pages d'un cours (pages ${i + 1} à ${i + part.length}).
Retranscris fidèlement tout leur contenu en Markdown : texte, formules, tableaux, exercices. Décris brièvement les schémas.
Réponds avec la retranscription seule.`, { images: part });
    }
    const source = `Voici le cours d'un élève (matière : ${mat().nom}).\n${text}${scans}${drive ? "\n" + drive : ""}${pasted ? `\nTexte collé :\n${pasted}` : ""}`;
    status("⏳ Le prof prépare le plan du cours…");
    const plan = await ask(`${source}

Découpe ce cours en blocs progressifs, une notion par bloc (2 à 8 blocs), dans l'ordre où il faut les apprendre.
Réponds uniquement en JSON : {"titre": string, "blocs": [{"titre": string, "notions": string}]}`, { json: true });
    if (!Array.isArray(plan?.blocs) || !plan.blocs.length) throw { code: "invalid_json" };
    const c = { id: uid(), titre: String(plan.titre || "Mon cours"), source,
      blocs: plan.blocs.map(x => ({ titre: String(x.titre), notions: String(x.notions || ""), cours: "", exercices: [] })) };
    mat().cours.push(c); pending.files = []; pending.drive = [];
    go("course", mat().cours.length - 1);
    for (const [i, bloc] of c.blocs.entries()) {
      status(`⏳ Le prof écrit la leçon ${i + 1} sur ${c.blocs.length} : ${bloc.titre}…`);
      await fillBloc(c, bloc);
    }
  });
}

// Writes one block's lesson and exercises from the course's own material.

Plan du cours : ${c.blocs.map(b => b.titre).join(" ; ")}.
Écris le bloc « ${bloc.titre} » (notions : ${bloc.notions}) : un cours clair et complet (définitions, méthode,
exemple résolu), puis 3 exercices NOUVEAUX, différents de ceux présents dans le cours (l'élève les a peut-être déjà faits),
de difficulté croissante, avec une solution détaillée.
Réponds uniquement en JSON : {"cours": string, "exercices": [${EX_SHAPE}]}`, { json: true });

// ---------- flashcards and quizzes ----------
function trainView() {
  const m = mat(); m.flash ||= []; m.quiz ||= [];

Le recto pose une question courte, le verso donne la réponse en une ou deux phrases.
Réponds uniquement en JSON : {"cartes": [{"recto": string, "verso": string}]}`, { json: true });
      const cartes = (r?.cartes || []).filter(c => c?.recto && c?.verso).map(c => ({ recto: String(c.recto), verso: String(c.verso) }));
      if (!cartes.length) throw { code: "invalid_json" };

    } else {

- "qcm" (environ 4) : 4 choix plausibles, une seule bonne réponse ("bonne" = numéro du bon choix, de 0 à 3) ;

Ajoute à chaque question une courte explication.
Réponds uniquement en JSON : {"questions": [
 {"type": "qcm", "question": string, "choix": [string, string, string, string], "bonne": number, "explication": string},
 {"type": "ouverte", "question": string, "reponse": string, "explication": string},

function flashPlayer(deck) {
  const box = el("section", { class: "sheet" });
  let order = deck.cartes.map((_, i) => i), pos = 0, flipped = false, missed = [];
  const draw = () => {
    box.innerHTML = ""; box.append(html("h2", "", `🃏 ${txt(deck.titre)}`));
    if (pos >= order.length) {
      box.append(el("p", { class: "score" }, `${order.length - missed.length} / ${order.length}`),
        el("p", { class: "mute", style: "text-align:center" }, `Tu savais ${order.length - missed.length} cartes sur ${order.length}.`),
        el("div", { class: "row" },
          ...(missed.length ? [button(`🔁 Revoir les ${missed.length} cartes à revoir`, "", () => { order = missed; missed = []; pos = 0; flipped = false; draw(); })] : []),
          button("Recommencer toutes les cartes", "ghost", () => { order = deck.cartes.map((_, i) => i); missed = []; pos = 0; flipped = false; draw(); })));
      return;
    }
    const c = deck.cartes[order[pos]];
    const card = el("div", { class: "card" }, el("p", { class: "mute" }, `Carte ${pos + 1} sur ${order.length}`), html("div", "cours", md(c.recto)));
    box.append(card);
    if (!flipped) box.append(el("div", { class: "row" }, button("🔄 Retourner la carte", "big", () => { flipped = true; draw(); })));
    else {
      card.append(html("div", "cours verso", md(c.verso)));
      const next = (knew) => { if (!knew) missed.push(order[pos]); pos++; flipped = false; draw(); };
      box.append(el("div", { class: "row" }, button("✓ Je savais", "big", () => next(true)), button("✗ À revoir", "danger big", () => next(false))));
    }
  };
  draw(); return box;
}

// Keeps only well-formed questions; old quizzes without a type are QCM.
function cleanQuestion(q) {
  if (!q?.question) return null;
  const base = { question: String(q.question), explication: String(q.explication || "") };
  const type = q.type || "qcm";
  if (type === "qcm" && Array.isArray(q.choix) && q.choix.length >= 2 && Number.isInteger(q.bonne) && q.bonne >= 0 && q.bonne < q.choix.length)
    return { type, ...base, choix: q.choix.map(String), bonne: q.bonne };
  if (type === "ouverte" && q.reponse) return { type, ...base, reponse: String(q.reponse) };
  if (type === "relier" && Array.isArray(q.paires)) {
    const paires = q.paires.filter(x => x?.gauche && x?.droite).map(x => ({ gauche: String(x.gauche), droite: String(x.droite) }));
    if (paires.length >= 2) return { type, ...base, paires };
  }
  return null;
}
const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function quizPlayer(qz) {
  const box = el("section", { class: "sheet" });
  let pos = 0, score = 0;
  const draw = () => {
    box.innerHTML = ""; box.append(html("h2", "", `❓ ${txt(qz.titre)}`));
    if (pos >= qz.questions.length) {
      qz.best = Math.max(qz.best ?? 0, score); save();
      box.append(el("p", { class: "score" }, `${score} / ${qz.questions.length}`),
        el("p", { class: "mute", style: "text-align:center" }, score === qz.questions.length ? "Parfait, bravo !" : "Relis les explications et recommence pour progresser."),
        el("div", { class: "row" }, button("🔁 Recommencer le quiz", "", () => { pos = 0; score = 0; draw(); })));
      return;
    }
    const q = cleanQuestion(qz.questions[pos]) || { type: "ouverte", question: "(question illisible)", reponse: "", explication: "" };
    const kind = { qcm: "QCM", ouverte: "Question / réponse", relier: "Relie les points" }[q.type];
    box.append(el("p", { class: "mute" }, `Question ${pos + 1} sur ${qz.questions.length} · ${kind} · score : ${score}`), html("div", "cours", md(q.question)));
    // Shows the result once, adds the point, then offers the next question.
    const finish = (ok, extra = "") => {
      if (ok) score++;
      box.append(html("div", "answer cours", `<b>${ok ? "✅ Bonne réponse !" : "❌ Pas tout à fait."}</b>${extra}${md(q.explication)}`),
        el("div", { class: "row" }, button(pos + 1 < qz.questions.length ? "Question suivante →" : "Voir mon score", "big", () => { pos++; draw(); })));
    };
    if (q.type === "qcm") {
      const choices = el("div", { class: "choices" }); box.append(choices);
      q.choix.forEach((label, i) => choices.append(button(`${"ABCD"[i] || i + 1}. ${label}`, "", () => {
        if (choices.dataset.done) return; choices.dataset.done = "1";
        [...choices.children].forEach((b, j) => { b.disabled = j !== i && j !== q.bonne; if (j === q.bonne) b.classList.add("right"); else if (j === i) b.classList.add("wrong"); });
        finish(i === q.bonne);
      })));
    } else if (q.type === "ouverte") {
      const id = "open-" + uid(), input = el("textarea", { id, placeholder: "Écris ta réponse ici…" });
      const check = el("div", { class: "row" });
      const judge = (ok) => { check.remove(); finish(ok); };
      check.append(button("Voir la réponse attendue", "", () => {
        input.readOnly = true;
        check.replaceChildren(html("div", "answer cours", `<b>Réponse attendue</b>${md(q.reponse)}`),
          button("✓ J'avais juste", "", () => judge(true)), button("✗ J'avais faux", "danger", () => judge(false)),
          button("🤔 Demander au prof", "ghost", (b) => busy(b, "⏳ Le prof vérifie ta réponse…", async () => {
            const v = await ask(`Question : ${q.question}\nRéponse attendue : ${q.reponse}\nRéponse de l'élève : ${input.value}
La réponse de l'élève est-elle juste sur le fond (même si elle est formulée autrement) ? Commence par « JUSTE » ou « FAUX », puis explique en une phrase.`);
            check.remove(); finish(/^\W*juste/i.test(v), md(v));
          })));
      }));
      box.append(el("label", { for: id, class: "mute" }, "Ta réponse"), input, check);
    } else {
      // Tap an item on the left, then its match on the right.
      const right = shuffle(q.paires.map((x, i) => ({ text: x.droite, i })));
      const links = new Map(); let sel = null;
      const grid = el("div", { class: "match" }), colL = el("div", { class: "choices" }), colR = el("div", { class: "choices" });
      grid.append(colL, colR); box.append(el("p", { class: "mute" }, "Touche un élément à gauche, puis celui qui va avec à droite."), grid);
      const paint = () => {
        [...colL.children].forEach((b, i) => { b.classList.toggle("selected", sel === i); b.dataset.n = links.has(i) ? [...links.keys()].indexOf(i) + 1 : ""; });
        [...colR.children].forEach((b) => { const k = [...links].find(([, r]) => r === Number(b.dataset.i)); b.dataset.n = k ? [...links.keys()].indexOf(k[0]) + 1 : ""; });
        verify.disabled = links.size < q.paires.length;
      };
      q.paires.forEach((x, i) => colL.append(button(x.gauche, "", () => { if (grid.dataset.done) return; sel = i; links.delete(i); paint(); })));
      right.forEach((x) => { const b = button(x.text, "", () => {
        if (grid.dataset.done || sel === null) return;
        for (const [k, r] of links) if (r === x.i) links.delete(k);
        links.set(sel, x.i); sel = null; paint(); }); b.dataset.i = x.i; colR.append(b); });
      const verify = button("Vérifier", "big", () => {
        grid.dataset.done = "1"; verify.remove();
        let good = 0;
        [...colL.children].forEach((b, i) => { const ok = links.get(i) === i; good += ok; b.classList.add(ok ? "right" : "wrong"); });
        const sol = q.paires.map(x => `- ${x.gauche} → ${x.droite}`).join("\n");
        finish(good === q.paires.length, `<p>${good} sur ${q.paires.length} bien reliés.</p>${good === q.paires.length ? "" : md("**Les bonnes paires :**\n" + sol)}`);
      });
      box.append(el("div", { class: "row" }, verify)); paint();
    }
  };
  draw(); return box;
}

// ---------- revision sheets ----------
function fichesView() {
  const m = mat();
  const gen = el("section", { class: "sheet" }, el("h2", {}, `Fiches de révision : ${m.nom}`));
  if (!m.cours.length) {
    gen.append(el("p", { class: "empty mute" }, "Ajoute d'abord un cours dans cette matière pour créer une fiche."), button("➕ Ajouter un cours", "", () => go("add")));
    return [gen];
  }
  const { ul: pick, chosen: chosenCourses } = pickCourses(m);
  gen.append(el("p", { class: "mute" }, "Choisis les cours à réviser (tous sont cochés : fiche sur toute la matière)."), pick,
    el("div", { class: "row" }, button("📝 Créer la fiche de révision", "big", (b) => busy(b, "⏳ Le prof rédige ta fiche de révision…", async () => {
      const chosen = chosenCourses();
      const content = courseText(chosen), titre = titleFor(m, chosen);
      const fiche = await ask(`Voici des cours de ${m.nom} :\n\n${content}

Rédige une fiche de révision claire et compacte (1 à 2 pages) : notions clés, définitions, formules et règles à retenir,
méthodes en étapes, pièges fréquents, et 5 questions d'auto-évaluation avec leurs réponses à la fin.
Organise-la par titres. Réponds avec la fiche seule.`);
      m.fiches.unshift({ id: uid(), titre, contenu: fiche }); save(); render();
    }))));
  const list = m.fiches.map((f, i) => {
    const d = el("details", { class: "sheet" }); d.open = i === 0;
    d.append(html("summary", "", txt(f.titre)), html("div", "cours", md(f.contenu)),
      el("div", { class: "row" }, twoTap("🗑 Supprimer cette fiche", "Toucher encore pour confirmer", "danger", () => { m.fiches.splice(i, 1); save(); render(); })));
    return d;
  });
  return [el("div", {}, button("← Mes cours", "ghost back", () => go("list"))), gen, ...list];
}

addEventListener("resize", () => { if (!narrow() && view === "list") go(course() ? "course" : "add"); });
render();
</script>
